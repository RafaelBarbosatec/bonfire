name: sprite_stack package

on:
  push:
    paths:
      - 'packages/sprite_stack/**'
      - '.github/workflows/sprite_stack.yml'
  pull_request:
    paths:
      - 'packages/sprite_stack/**'
      - '.github/workflows/sprite_stack.yml'

jobs:
  package:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sprite_stack
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

  example:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sprite_stack/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release
