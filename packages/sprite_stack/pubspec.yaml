name: sprite_stack
description: >-
  Render sprite-stacking props in Flutter with free turntable rotation.
  Feed it a horizontal slice strip (top-down cross-sections) and get a
  fake-3D billboard that spins.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flame: '>=1.28.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
