name: sprite_stack
description: >-
  Render sprite-stacking props in Flutter with free turntable rotation from a
  horizontal strip of top-down cross-sections. One draw per slice.
version: 0.1.0

homepage: https://github.com/RafaelBarbosatec/bonfire/tree/master/packages/sprite_stack
repository: https://github.com/RafaelBarbosatec/bonfire
issue_tracker: https://github.com/RafaelBarbosatec/bonfire/issues
documentation: https://github.com/RafaelBarbosatec/bonfire/tree/master/packages/sprite_stack#readme

topics:
  - gamedev
  - flame
  - sprites
  - pixel-art
  - rendering

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flame: '>=1.28.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
